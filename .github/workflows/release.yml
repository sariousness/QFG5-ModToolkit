name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version for the package names
        required: true
        default: "1.2.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_name || inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory artifacts\packages -NonInteractive
          $frameworkRoot = (Resolve-Path 'artifacts\packages\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework').Path
          if (-not (Test-Path (Join-Path $frameworkRoot 'v4.0'))) {
            throw "The .NET Framework 4.0 reference assemblies were not found."
          }
          "FRAMEWORK_ROOT=$frameworkRoot" >> $env:GITHUB_ENV

      - name: Build x86 application
        shell: pwsh
        run: |
          msbuild src\QFG5Extractor.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x86 "/p:TargetFrameworkRootPath=$env:FRAMEWORK_ROOT" "/p:FrameworkPathOverride=$env:FRAMEWORK_ROOT\v4.0"

      - name: Stage portable ZIP
        shell: pwsh
        run: |
          $package = 'dist\portable'
          if (Test-Path 'dist') {
            Remove-Item 'dist' -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $requiredFiles = @('QFG5Extractor.exe', 'OpenTK.dll', 'OpenTK.GLControl.dll', 'model_db.json', 'objects.dat', 'flags.dat')
          foreach ($file in $requiredFiles) {
            $source = Join-Path 'src\bin\Release' $file
            if (-not (Test-Path $source)) {
              throw "Build output is missing required file: $file"
            }
            Copy-Item $source -Destination $package
          }
          Copy-Item README.md, USER_GUIDE.md, FEATURE_STATUS.md, CHANGELOG.md, re-notes.MD -Destination $package
          Compress-Archive -Path 'dist\portable\*' -DestinationPath "dist\QFG5Extractor-$env:APP_VERSION-portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          $source = (Resolve-Path 'dist\portable').Path
          & $compiler "/DAppSource=$source" "/DAppVersion=$env:APP_VERSION" 'installer\QFG5Extractor.iss'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: QFG5Extractor-${{ env.APP_VERSION }}
          path: |
            dist/QFG5Extractor-${{ env.APP_VERSION }}-portable.zip
            dist/QFG5Extractor-${{ env.APP_VERSION }}-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/QFG5Extractor-$env:APP_VERSION-portable.zip" `
            "dist/QFG5Extractor-$env:APP_VERSION-Setup.exe" `
            --title "QFG5Extractor $env:GITHUB_REF_NAME" `
            --generate-notes
